name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: zmg_cafes_ci
          POSTGRES_USER: zmg_cafes
          POSTGRES_PASSWORD: zmg_cafes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zmg_cafes -d zmg_cafes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Apply Flyway migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/db/migrations:/flyway/migrations:ro" \
            -e FLYWAY_URL="jdbc:postgresql://localhost:5432/zmg_cafes_ci" \
            -e FLYWAY_USER="zmg_cafes" \
            -e FLYWAY_PASSWORD="zmg_cafes_ci" \
            -e FLYWAY_SCHEMAS="meta" \
            -e FLYWAY_CREATE_SCHEMAS="true" \
            redgate/flyway:13.6.0 migrate
      - name: Run integration tests
        env:
          ZMG_TEST_DATABASE_URL: postgresql://zmg_cafes:zmg_cafes_ci@localhost:5432/zmg_cafes_ci
        run: uv run pytest -q tests/integration
