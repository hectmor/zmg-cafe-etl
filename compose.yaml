services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zmg_cafes}
      POSTGRES_USER: ${POSTGRES_USER:-zmg_cafes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zmg_cafes_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  flyway:
    image: redgate/flyway:13.6.0
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-zmg_cafes}
      FLYWAY_USER: ${POSTGRES_USER:-zmg_cafes}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-zmg_cafes_dev}
      FLYWAY_SCHEMAS: meta
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    volumes:
      - ./db/migrations:/flyway/migrations:ro
    command: migrate

  # Disposable database for ZMG_TEST_DATABASE_URL (issue #59): never the
  # same database as `db` above. No named volume — data does not survive
  # `docker compose down`/container removal, by design.
  test-db:
    image: postgis/postgis:17-3.5
    profiles: ["test"]
    environment:
      POSTGRES_DB: zmg_cafes_test
      POSTGRES_USER: ${POSTGRES_USER:-zmg_cafes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zmg_cafes_dev}
    ports:
      - "${TEST_POSTGRES_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  test-flyway:
    image: redgate/flyway:13.6.0
    profiles: ["test"]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://test-db:5432/zmg_cafes_test
      FLYWAY_USER: ${POSTGRES_USER:-zmg_cafes}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-zmg_cafes_dev}
      FLYWAY_SCHEMAS: meta
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    volumes:
      - ./db/migrations:/flyway/migrations:ro
    command: migrate

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zmg_cafes}:${POSTGRES_PASSWORD:-zmg_cafes_dev}@db:5432/${POSTGRES_DB:-zmg_cafes}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["etl"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zmg_cafes}:${POSTGRES_PASSWORD:-zmg_cafes_dev}@db:5432/${POSTGRES_DB:-zmg_cafes}
    volumes:
      - ./config:/app/config:ro
      - ./tests/fixtures:/app/tests/fixtures:ro
      - ./data:/app/data
    command:
      [
        "python",
        "-m",
        "zmg_cafes_etl",
        "--offline",
        "tests/fixtures/overpass_cafes_sample.json",
      ]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
